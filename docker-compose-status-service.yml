services:
  status-service:
    build: .
    container_name: status-service
    environment:
      # Minecraft, Palworld and Enshrouded publish their ports on the Docker
      # host, so we reach them through the host gateway.
      STATUS_MINECRAFT_HOST: ${STATUS_MINECRAFT_HOST:-host.docker.internal}
      STATUS_PALWORLD_HOST: ${STATUS_PALWORLD_HOST:-host.docker.internal}
      STATUS_ENSHROUDED_HOST: ${STATUS_ENSHROUDED_HOST:-host.docker.internal}
      # TeamSpeak is reached over the shared status-net by container name; the
      # WebQuery api key is injected from a Jenkins credential.
      STATUS_TEAMSPEAK_HOST: ${STATUS_TEAMSPEAK_HOST:-teamspeak-server}
      STATUS_TEAMSPEAK_QUERY_APIKEY: ${TS_WEBQUERY_APIKEY:-}
      STATUS_REFRESH_INTERVAL: ${STATUS_REFRESH_INTERVAL:-30s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - status-net
    restart: unless-stopped

networks:
  status-net:
    name: status-net
