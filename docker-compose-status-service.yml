services:
  status-service:
    build: .
    container_name: status-service
    environment:
      # Game servers publish their ports on the Docker host, so we reach them
      # through the host gateway rather than over a shared Docker network.
      STATUS_TEAMSPEAK_HOST: ${STATUS_TEAMSPEAK_HOST:-host.docker.internal}
      STATUS_MINECRAFT_HOST: ${STATUS_MINECRAFT_HOST:-host.docker.internal}
      STATUS_PALWORLD_HOST: ${STATUS_PALWORLD_HOST:-host.docker.internal}
      STATUS_ENSHROUDED_HOST: ${STATUS_ENSHROUDED_HOST:-host.docker.internal}
      STATUS_REFRESH_INTERVAL: ${STATUS_REFRESH_INTERVAL:-30s}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - status-net
    restart: unless-stopped

networks:
  status-net:
    name: status-net
